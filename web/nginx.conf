# Serves the built SPA and proxies /api to the api container. The API already
# mounts everything under /api, so the path passes through unchanged.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. nginx otherwise resolves an upstream name once, at
    # startup, and refuses to start at all if it is not resolvable yet — so a slow
    # api container would take the whole web container down with it. Resolving per
    # request via a variable also means a restarted api is picked up without a
    # reload. 10-local-resolvers.envsh would give us $NGINX_LOCAL_RESOLVERS, but
    # 127.0.0.11 is the fixed address inside a user-defined compose network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # the app is offline-first and small; keep the hashed assets cached hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        set $api_upstream "http://api:8000";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # an .xlsx export of a big profile takes a moment
        client_max_body_size 2m;    # uploaded .xlsx / .csv profiles; matches QS_MAX_UPLOAD_BYTES
    }

    # history-mode routing: unknown paths are app routes, not 404s
    location / {
        try_files $uri $uri/ /index.html;
    }
}
