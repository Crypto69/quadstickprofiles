# Runs on every push and pull request. The full check required before a
# commit: core + API tests on SQLite, the API tests against Postgres 16 through the
# real migration chain (with an up/down/up of that chain), the web tests, typecheck
# and build, and a build of both Docker images without pushing them.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]          # tags are handled by release.yml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: core + api (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            api/pyproject.toml
      - run: pip install -e "core[dev]" -e "api[dev]"
      - run: pytest -q

  python-postgres:
    name: api (Postgres 16, real migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quadstick
          POSTGRES_USER: quadstick
          POSTGRES_PASSWORD: quadstick
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quadstick -d quadstick"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      QS_DATABASE_URL: postgresql+psycopg://quadstick:quadstick@localhost:5432/quadstick
      QS_TEST_DATABASE_URL: postgresql+psycopg://quadstick:quadstick@localhost:5432/quadstick
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            api/pyproject.toml
      - run: pip install -e "core[dev]" -e "api[dev,postgres]"
      - name: Migration chain up / down / up
        working-directory: api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: API tests against Postgres
        run: pytest -q api/tests

  web:
    name: web (Vitest, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  desktop:
    name: desktop launcher (headless, from the checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            api/pyproject.toml
      - run: pip install -e core -e api platformdirs
      - run: sh scripts/desktop_check.sh python desktop/launcher.py

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
