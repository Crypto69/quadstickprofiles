# The Microsoft Store package (.msix), ready to upload to Partner Center.
#
# Runs on every v* tag, beside the release; on any push that changes the
# packaging; and by hand from the Actions tab (Run workflow; pick the tag to
# package under "Use workflow from"). The .msix is
# left as a download on the run's page; it is not attached to the GitHub Release,
# because nobody can install it outside the Store (it is unsigned until
# Partner Center signs it).
#
# Until packaging/windows/store-identity.json holds the Partner Center values, the
# package is a test one under a made-up identity, named ...-TEST-not-for-upload.
#
# Before the upload, a signed copy of the package is installed on this runner and
# started headless through its alias, and scripts/desktop_check.sh proves it serves
# the app, the API and an export from inside its package. The copy is signed with
# a throwaway certificate made here; what is uploaded is the unsigned original.
name: Windows Store package

on:
  push:
    tags: ["v*"]
    # and whenever the packaging itself changes, on any branch, so a change to it is
    # checked on Windows before it reaches a release. `branches` has to be named:
    # with only `tags` listed, GitHub ignores every branch push.
    branches: ["**"]
    paths:
      - packaging/windows/**
      - desktop/make_msix.ps1
      - .github/workflows/store-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    name: Build and check the .msix
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scripts/version.sh counts commits off a tag
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            api/pyproject.toml
            desktop/requirements.txt
      - run: pip install -e core -e api -r desktop/requirements.txt
        shell: bash

      - name: Build the Windows app
        run: pwsh -File desktop/build.ps1

      - name: Pack the .msix
        shell: pwsh
        run: |
          $v = (Get-Content desktop/version.txt | Where-Object { $_ -like "APP_VERSION=*" }) -replace "APP_VERSION=", ""
          $id = Get-Content packaging/windows/store-identity.json -Raw
          if ($id -match "REPLACE_WITH") {
            Write-Host "::warning::packaging/windows/store-identity.json has no Partner Center values yet, so this is a test package that cannot be uploaded."
            pwsh -File desktop/make_msix.ps1 -Version $v -Test
          } else {
            pwsh -File desktop/make_msix.ps1 -Version $v
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install a signed copy and start it headless
        shell: pwsh
        run: |
          $msix = Get-Content desktop/dist/msix-path.txt
          $manifest = [xml](Get-Content desktop/build/msix/AppxManifest.xml)
          $publisher = $manifest.Package.Identity.Publisher
          $name = $manifest.Package.Identity.Name
          # A throwaway certificate whose subject is the package's publisher, trusted
          # on this runner only, so Windows will install the copy.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName "QuadStick Profile Studio CI" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $cer = "$env:RUNNER_TEMP\ci.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $copy = "$env:RUNNER_TEMP\signed-copy.msix"
          Copy-Item $msix $copy
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $copy
          if ($LASTEXITCODE) { throw "signtool failed" }
          Add-AppxPackage -Path $copy
          $pkg = Get-AppxPackage -Name $name
          if (-not $pkg) { throw "the package did not install" }
          Write-Host "installed $($pkg.PackageFullName) at $($pkg.InstallLocation)"
          "$env:LOCALAPPDATA\Microsoft\WindowsApps\quadstick-profile-studio.exe" | Set-Content -NoNewline "$env:RUNNER_TEMP\alias.txt"

      - name: Headless check of the installed package
        shell: bash
        run: |
          alias="$(cat "$RUNNER_TEMP/alias.txt")"
          [ -e "$alias" ] || { echo "::error::the app's command alias was not created: $alias"; ls -la "$(dirname "$alias")"; exit 1; }
          sh scripts/desktop_check.sh "$alias"

      - name: Stop anything the check left running
        if: always()
        shell: pwsh
        run: Get-Process "QuadStick Profile Studio" -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: desktop/dist/*.msix
          if-no-files-found: error
